<!doctype html>
<html lang="en" data-brand="mercedes" data-mode="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f5f5" />
  <title>Personal AI Assistant</title>
  <script>
    try {
      const savedBrand = localStorage.getItem("personal-assistant-brand")
        || localStorage.getItem("personal-assistant-theme");
      const savedMode = localStorage.getItem("personal-assistant-mode");

      if (savedBrand === "mercedes" || savedBrand === "ferrari") {
        document.documentElement.dataset.brand = savedBrand;
      }
      if (savedMode === "light" || savedMode === "dark") {
        document.documentElement.dataset.mode = savedMode;
      }
    } catch {
      // Use the default Mercedes light theme when storage is unavailable.
    }
  </script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="app-shell">
    <button
      id="sidebarBackdrop"
      class="sidebar-backdrop"
      type="button"
      aria-label="Close conversations"
      tabindex="-1"
    ></button>

    <aside id="conversationSidebar" class="conversation-sidebar" aria-label="Conversations">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <span class="brand-mark" aria-hidden="true">AI</span>
          <span class="brand-copy">
            <strong>Personal Assistant</strong>
            <small>Private workspace</small>
          </span>
        </div>
        <button id="closeSidebarButton" class="icon-button close-sidebar-button" type="button" aria-label="Close conversations">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <button id="newChatButton" class="new-chat-button" type="button">
        <span aria-hidden="true">+</span>
        New chat
      </button>
      <p class="conversation-label">Recent conversations</p>
      <div id="conversationList" class="conversation-list"></div>
    </aside>

    <section class="chat-panel">
      <header class="chat-header">
        <button
          id="openSidebarButton"
          class="icon-button open-sidebar-button"
          type="button"
          aria-label="Open conversations"
          aria-controls="conversationSidebar"
          aria-expanded="false"
        >
          <span aria-hidden="true">&#9776;</span>
        </button>

        <div class="header-copy">
          <h1>Personal AI Assistant</h1>
          <p class="status" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="statusText">Ready</span></p>
        </div>

        <div class="theme-controls">
          <div class="brand-switcher" role="group" aria-label="Brand theme">
            <button class="brand-button" type="button" data-brand-choice="mercedes" aria-pressed="true">Mercedes</button>
            <button class="brand-button" type="button" data-brand-choice="ferrari" aria-pressed="false">Ferrari</button>
          </div>
          <button id="modeToggle" class="mode-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
            <span id="modeIcon" class="mode-icon" aria-hidden="true">&#9728;</span>
            <span id="modeLabel">Light</span>
          </button>
        </div>
      </header>

      <div id="messages" class="messages">
        <div id="welcomeState" class="welcome-state">
          <span class="welcome-mark" aria-hidden="true">AI</span>
          <h2>How can I help?</h2>
          <p>Ask about your notes, schedule, todos, or anything you are working through.</p>
        </div>
      </div>

      <form id="chatForm" class="composer">
        <div class="composer-field">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Ask your assistant..."
            aria-label="Message"
            required
          ></textarea>
          <span class="composer-hint">Shift + Enter for a new line</span>
        </div>
        <button id="sendButton" class="send-button" type="submit">
          <span>Send</span>
          <span class="send-icon" aria-hidden="true">&#8593;</span>
        </button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script>
    window.APP_CONFIG = {
        API_BASE_URL: window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"? 
        "": "https://api.bojiakpui-xyz-student-web-app.me",
    };
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
