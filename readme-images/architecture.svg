<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" role="img" aria-label="Kairos architecture: browser to Vite frontend to FastAPI to LangGraph agent, which fans out to Obsidian, todo, calendar and finance tools over their backing stores.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b5b78"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="620" rx="16" fill="#0c0c12"/>
  <rect x="0.5" y="0.5" width="1159" height="619" rx="16" fill="none" stroke="#23232f"/>

  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">
    <text x="40" y="42" font-size="13" letter-spacing="2.5" fill="#7c7c96">KAIROS // ARCHITECTURE</text>
    <text x="40" y="92" font-size="10.5" letter-spacing="2" fill="#61617a">REQUEST PATH</text>
    <text x="40" y="238" font-size="10.5" letter-spacing="2" fill="#61617a">TOOLS</text>
    <text x="40" y="384" font-size="10.5" letter-spacing="2" fill="#61617a">STORES</text>
  </g>
  <rect x="40" y="52" width="34" height="3" fill="#a855f7"/>

  <!-- ============ row 1: request chain ============ -->
  <g font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ecebf5" text-anchor="middle">
    <rect x="40" y="104" width="200" height="78" rx="8" fill="#16161f" stroke="#2c2c3c"/>
    <rect x="40" y="104" width="3" height="78" fill="#a855f7"/>
    <text x="140" y="138">Browser</text>

    <rect x="290" y="104" width="250" height="78" rx="8" fill="#16161f" stroke="#2c2c3c"/>
    <rect x="290" y="104" width="3" height="78" fill="#a855f7"/>
    <text x="415" y="138">React + Vite frontend</text>

    <rect x="590" y="104" width="250" height="78" rx="8" fill="#16161f" stroke="#2c2c3c"/>
    <rect x="590" y="104" width="3" height="78" fill="#a855f7"/>
    <text x="715" y="138">FastAPI · JSON only</text>

    <rect x="890" y="104" width="230" height="78" rx="8" fill="#16161f" stroke="#3d2b5c"/>
    <rect x="890" y="104" width="3" height="78" fill="#c084fc"/>
    <text x="1005" y="138">LangGraph agent</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8b8ba6" text-anchor="middle">
    <text x="140" y="158">chat + finance dashboard</text>
    <text x="415" y="158">Cloudflare Pages · two skins</text>
    <text x="715" y="158">Cloudflare Access + Tunnel</text>
    <text x="1005" y="158">Gemini · 26 tools</text>
  </g>

  <g stroke="#5b5b78" stroke-width="1.5">
    <line x1="242" y1="143" x2="286" y2="143" marker-end="url(#arrow)"/>
    <line x1="542" y1="143" x2="586" y2="143" marker-end="url(#arrow)"/>
    <line x1="842" y1="143" x2="886" y2="143" marker-end="url(#arrow)"/>
    <path d="M 1005 182 L 1005 214" fill="none"/>
    <path d="M 160 214 L 1005 214" fill="none"/>
    <path d="M 160 214 L 160 246" fill="none" marker-end="url(#arrow)"/>
    <path d="M 440 214 L 440 246" fill="none" marker-end="url(#arrow)"/>
    <path d="M 720 214 L 720 246" fill="none" marker-end="url(#arrow)"/>
    <path d="M 1005 214 L 1005 246" fill="none" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ row 2: tool groups ============ -->
  <rect x="40" y="252" width="240" height="94" rx="8" fill="#14141d" stroke="#2c2c3c"/>
  <rect x="320" y="252" width="240" height="94" rx="8" fill="#14141d" stroke="#2c2c3c"/>
  <rect x="600" y="252" width="240" height="94" rx="8" fill="#14141d" stroke="#2c2c3c"/>
  <rect x="880" y="252" width="240" height="94" rx="8" fill="#14141d" stroke="#3d2b5c"/>

  <g font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ecebf5">
    <text x="60" y="280">Obsidian notes</text>
    <text x="340" y="280">Daily todos</text>
    <text x="620" y="280">Google Calendar</text>
    <text x="900" y="280">Finance</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.6" fill="#c9a2ff" text-anchor="end">
    <text x="260" y="280">2</text>
    <text x="540" y="280">4</text>
    <text x="820" y="280">4</text>
    <text x="1100" y="280">15</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8b8ba6">
    <text x="60" y="304">list_vault_structure</text>
    <text x="60" y="324">search_notes</text>
    <text x="340" y="304">list · add · update · delete</text>
    <text x="340" y="324">index + expected text</text>
    <text x="620" y="304">list · create · update · delete</text>
    <text x="620" y="324">confirmation scales with risk</text>
    <text x="900" y="304">transactions · summaries</text>
    <text x="900" y="324">categories · budgets · goals</text>
  </g>

  <g stroke="#3f3f56" stroke-width="1.5">
    <line x1="160" y1="346" x2="160" y2="392" marker-end="url(#arrow)"/>
    <line x1="440" y1="346" x2="440" y2="392" marker-end="url(#arrow)"/>
    <line x1="720" y1="346" x2="720" y2="392" marker-end="url(#arrow)"/>
    <line x1="1000" y1="346" x2="1000" y2="392" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ row 3: backing stores ============ -->
  <g fill="#101018" stroke="#262634" stroke-dasharray="4 3">
    <rect x="40" y="398" width="240" height="72" rx="8"/>
    <rect x="320" y="398" width="240" height="72" rx="8"/>
    <rect x="600" y="398" width="240" height="72" rx="8"/>
    <rect x="880" y="398" width="240" height="72" rx="8"/>
  </g>

  <g font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ecebf5" text-anchor="middle">
    <text x="160" y="428">ChromaDB</text>
    <text x="440" y="428">Vault markdown</text>
    <text x="720" y="428">Google Calendar API</text>
    <text x="1000" y="428">SQLite ledger</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8b8ba6" text-anchor="middle">
    <text x="160" y="448">bge-base-en-v1.5 embeddings</text>
    <text x="440" y="448">Journal/to-dos</text>
    <text x="720" y="448">external service</text>
    <text x="1000" y="448">src/finance/service.py</text>
  </g>

  <!-- ============ footer notes ============ -->
  <rect x="40" y="502" width="525" height="82" rx="8" fill="#14141d" stroke="#2c2c3c"/>
  <rect x="40" y="502" width="3" height="82" fill="#c084fc"/>
  <rect x="595" y="502" width="525" height="82" rx="8" fill="#14141d" stroke="#2c2c3c"/>
  <rect x="595" y="502" width="3" height="82" fill="#c084fc"/>

  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#b9b8ce">
    <text x="64" y="530"><tspan fill="#d8b4fe">SSE</tspan> · every agent step streams back as its own event</text>
    <text x="64" y="552">status → tool_call_requested → tool_result_received</text>
    <text x="64" y="572">→ final, each carrying elapsed_ms and step_ms</text>
    <text x="619" y="530"><tspan fill="#d8b4fe">EVENT LOG</tspan> · the same events are appended to SQLite</text>
    <text x="619" y="552">so history rebuilds exactly, and the dashboard shares</text>
    <text x="619" y="572">one finance module with the agent — no drift</text>
  </g>
</svg>
